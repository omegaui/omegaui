<svg fill="none" viewBox="0 0 800 50" width="800" height="50" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.section {
					display: flex;
					align-items: center;
					justify-content: center;
					gap: 16px;
					height: 50px;
					font-family: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
				}

				.line {
					height: 1px;
					width: 120px;
					background: linear-gradient(90deg, transparent, #d0d7de);
				}

				.line-r {
					background: linear-gradient(90deg, #d0d7de, transparent);
				}

				.label {
					color: #656d76;
					font-size: 13px;
					letter-spacing: 2px;
					text-transform: uppercase;
					animation: fadeIn 1s ease-out;
				}

				.dot {
					width: 5px;
					height: 5px;
					background: #e8326e;
					border-radius: 50%;
					animation: pulse 2s ease-in-out infinite;
				}

				@keyframes pulse {
					0%, 100% { opacity: 0.4; transform: scale(1); }
					50% { opacity: 1; transform: scale(1.3); }
				}

				@keyframes fadeIn {
					0% { opacity: 0; }
					100% { opacity: 1; }
				}
			</style>
			<div class="section">
				<div class="line"></div>
				<div class="dot"></div>
				<span class="label">recent builds</span>
				<div class="dot"></div>
				<div class="line line-r"></div>
			</div>
		</div>
	</foreignObject>
</svg>