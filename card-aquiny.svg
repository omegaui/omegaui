<svg fill="none" viewBox="0 0 388 170" width="388" height="170" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 378px;
					height: 160px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 14px;
					border: 1px solid #21262d;
					padding: 22px 24px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 5px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 4px;
					background: linear-gradient(180deg, #3572A5, #6ba3d6);
					border-radius: 14px 0 0 14px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 8px rgba(53, 114, 165, 0.2); }
					100% { box-shadow: 0 0 20px rgba(53, 114, 165, 0.5); }
				}

				.bg-orb {
					position: absolute;
					top: -30px;
					right: -30px;
					width: 120px;
					height: 120px;
					background: radial-gradient(circle, rgba(53, 114, 165, 0.06) 0%, transparent 70%);
					border-radius: 50%;
				}

				.icon-area {
					position: absolute;
					top: 18px;
					right: 22px;
				}

				.bell {
					width: 20px;
					height: 20px;
					background: rgba(53, 114, 165, 0.15);
					border: 1.5px solid rgba(53, 114, 165, 0.4);
					border-radius: 10px 10px 2px 2px;
					position: relative;
					animation: bellRing 3s ease-in-out infinite;
				}

				@keyframes bellRing {
					0%, 80%, 100% { transform: rotate(0deg); }
					85% { transform: rotate(5deg); }
					90% { transform: rotate(-5deg); }
					95% { transform: rotate(3deg); }
				}

				.bell-clapper {
					width: 5px;
					height: 5px;
					background: #3572A5;
					border-radius: 50%;
					position: absolute;
					bottom: -4px;
					left: 6px;
				}

				.wave {
					position: absolute;
					border: 1.5px solid rgba(53, 114, 165, 0.25);
					border-radius: 50%;
					animation: waveExpand 2s ease-out infinite;
				}

				.wave-1 {
					width: 30px;
					height: 30px;
					top: -3px;
					left: -4px;
					animation-delay: 0s;
				}

				.wave-2 {
					width: 40px;
					height: 40px;
					top: -8px;
					left: -9px;
					animation-delay: 0.5s;
				}

				@keyframes waveExpand {
					0% { opacity: 0.6; transform: scale(0.8); }
					100% { opacity: 0; transform: scale(1.3); }
				}

				.name {
					color: #e6edf3;
					font-size: 17px;
					font-weight: 600;
					margin-bottom: 8px;
					letter-spacing: -0.3px;
				}

				.desc {
					color: #7d8590;
					font-size: 12.5px;
					line-height: 1.45;
					max-width: 295px;
				}

				.meta {
					position: absolute;
					bottom: 20px;
					left: 24px;
					display: flex;
					align-items: center;
					gap: 8px;
				}

				.lang-dot {
					width: 10px;
					height: 10px;
					background: #3572A5;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 11.5px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="bg-orb"></div>
				<div class="icon-area">
					<div class="bell">
						<div class="bell-clapper"></div>
						<div class="wave wave-1"></div>
						<div class="wave wave-2"></div>
					</div>
				</div>
				<div class="name">aquiny</div>
				<div class="desc">A CLI assistant that schedules voice-based desktop notifications using natural language</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Python</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>