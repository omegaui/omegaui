<svg fill="none" viewBox="0 0 196 155" width="196" height="155" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 149px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 12px;
					border: 1px solid #21262d;
					padding: 16px 14px 14px 18px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #3572A5, #6ba3d6);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(53, 114, 165, 0.15); }
					100% { box-shadow: 0 0 14px rgba(53, 114, 165, 0.45); }
				}

				.icon-area {
					position: absolute;
					top: 14px;
					right: 16px;
				}

				.bell {
					width: 16px;
					height: 16px;
					background: rgba(53, 114, 165, 0.12);
					border: 1.5px solid rgba(53, 114, 165, 0.35);
					border-radius: 8px 8px 2px 2px;
					position: relative;
					animation: bellRing 3s ease-in-out infinite;
				}

				@keyframes bellRing {
					0%, 80%, 100% { transform: rotate(0deg); }
					85% { transform: rotate(5deg); }
					90% { transform: rotate(-5deg); }
					95% { transform: rotate(3deg); }
				}

				.bell-clapper {
					width: 4px;
					height: 4px;
					background: #3572A5;
					border-radius: 50%;
					position: absolute;
					bottom: -3px;
					left: 5px;
				}

				.wave {
					position: absolute;
					border: 1px solid rgba(53, 114, 165, 0.2);
					border-radius: 50%;
					animation: waveExpand 2s ease-out infinite;
				}

				.wave-1 {
					width: 24px;
					height: 24px;
					top: -2px;
					left: -3px;
				}

				.wave-2 {
					width: 32px;
					height: 32px;
					top: -6px;
					left: -7px;
					animation-delay: 0.5s;
				}

				@keyframes waveExpand {
					0% { opacity: 0.5; transform: scale(0.8); }
					100% { opacity: 0; transform: scale(1.3); }
				}

				.name {
					color: #e6edf3;
					font-size: 13px;
					font-weight: 600;
					margin-bottom: 6px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #7d8590;
					font-size: 10.5px;
					line-height: 1.4;
					max-width: 155px;
				}

				.meta {
					position: absolute;
					bottom: 14px;
					left: 18px;
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.lang-dot {
					width: 8px;
					height: 8px;
					background: #3572A5;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 10px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="bell">
						<div class="bell-clapper"></div>
						<div class="wave wave-1"></div>
						<div class="wave wave-2"></div>
					</div>
				</div>
				<div class="name">aquiny</div>
				<div class="desc">Schedule voice-based desktop notifications using natural language</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Python</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>