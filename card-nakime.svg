<svg fill="none" viewBox="0 0 388 170" width="388" height="170" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 378px;
					height: 160px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 14px;
					border: 1px solid #21262d;
					padding: 22px 24px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 5px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 4px;
					background: linear-gradient(180deg, #00B4AB, #4dd9d2);
					border-radius: 14px 0 0 14px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 8px rgba(0, 180, 171, 0.2); }
					100% { box-shadow: 0 0 20px rgba(0, 180, 171, 0.5); }
				}

				.bg-orb {
					position: absolute;
					top: -30px;
					right: -30px;
					width: 120px;
					height: 120px;
					background: radial-gradient(circle, rgba(0, 180, 171, 0.06) 0%, transparent 70%);
					border-radius: 50%;
				}

				.icon-area {
					position: absolute;
					top: 22px;
					right: 22px;
				}

				.eye {
					width: 32px;
					height: 16px;
					border: 1.5px solid rgba(0, 180, 171, 0.4);
					border-radius: 50%;
					position: relative;
					background: rgba(0, 180, 171, 0.08);
					animation: eyeBlink 4s ease-in-out infinite;
				}

				@keyframes eyeBlink {
					0%, 42%, 48%, 100% { transform: scaleY(1); }
					45% { transform: scaleY(0.1); }
				}

				.pupil {
					width: 8px;
					height: 8px;
					background: #00B4AB;
					border-radius: 50%;
					position: absolute;
					top: 2.5px;
					left: 10.5px;
					animation: eyeLook 5s ease-in-out infinite;
				}

				@keyframes eyeLook {
					0%, 100% { transform: translateX(0); }
					25% { transform: translateX(3px); }
					50% { transform: translateX(0); }
					75% { transform: translateX(-3px); }
				}

				.pupil-inner {
					width: 3px;
					height: 3px;
					background: #0d1117;
					border-radius: 50%;
					position: absolute;
					top: 2.5px;
					left: 2.5px;
				}

				.scan-line {
					position: absolute;
					width: 38px;
					height: 1px;
					background: linear-gradient(90deg, transparent, rgba(0, 180, 171, 0.3), transparent);
					top: 7px;
					left: -4px;
					animation: scan 3s ease-in-out infinite;
				}

				@keyframes scan {
					0%, 100% { opacity: 0; }
					50% { opacity: 1; }
				}

				.name {
					color: #e6edf3;
					font-size: 17px;
					font-weight: 600;
					margin-bottom: 8px;
					letter-spacing: -0.3px;
				}

				.desc {
					color: #7d8590;
					font-size: 12.5px;
					line-height: 1.45;
					max-width: 295px;
				}

				.meta {
					position: absolute;
					bottom: 20px;
					left: 24px;
					display: flex;
					align-items: center;
					gap: 8px;
				}

				.lang-dot {
					width: 10px;
					height: 10px;
					background: #00B4AB;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 11.5px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="bg-orb"></div>
				<div class="icon-area">
					<div class="eye">
						<div class="pupil">
							<div class="pupil-inner"></div>
						</div>
						<div class="scan-line"></div>
					</div>
				</div>
				<div class="name">nakime</div>
				<div class="desc">Track your PC sessions and find out if someone tried to turn on your computer</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Dart</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>