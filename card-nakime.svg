<svg fill="none" viewBox="0 0 196 155" width="196" height="155" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 149px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 12px;
					border: 1px solid #21262d;
					padding: 16px 14px 14px 18px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #00B4AB, #4dd9d2);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(0, 180, 171, 0.15); }
					100% { box-shadow: 0 0 14px rgba(0, 180, 171, 0.45); }
				}

				.icon-area {
					position: absolute;
					top: 16px;
					right: 14px;
				}

				.eye {
					width: 26px;
					height: 13px;
					border: 1.5px solid rgba(0, 180, 171, 0.35);
					border-radius: 50%;
					position: relative;
					background: rgba(0, 180, 171, 0.06);
					animation: eyeBlink 4s ease-in-out infinite;
				}

				@keyframes eyeBlink {
					0%, 42%, 48%, 100% { transform: scaleY(1); }
					45% { transform: scaleY(0.1); }
				}

				.pupil {
					width: 7px;
					height: 7px;
					background: #00B4AB;
					border-radius: 50%;
					position: absolute;
					top: 1.5px;
					left: 8px;
					animation: eyeLook 5s ease-in-out infinite;
				}

				@keyframes eyeLook {
					0%, 100% { transform: translateX(0); }
					25% { transform: translateX(2px); }
					75% { transform: translateX(-2px); }
				}

				.pupil-inner {
					width: 3px;
					height: 3px;
					background: #0d1117;
					border-radius: 50%;
					position: absolute;
					top: 2px;
					left: 2px;
				}

				.name {
					color: #e6edf3;
					font-size: 13px;
					font-weight: 600;
					margin-bottom: 6px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #7d8590;
					font-size: 10.5px;
					line-height: 1.4;
					max-width: 155px;
				}

				.meta {
					position: absolute;
					bottom: 14px;
					left: 18px;
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.lang-dot {
					width: 8px;
					height: 8px;
					background: #00B4AB;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 10px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="eye">
						<div class="pupil">
							<div class="pupil-inner"></div>
						</div>
					</div>
				</div>
				<div class="name">nakime</div>
				<div class="desc">Track PC sessions and detect unauthorized access attempts</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Dart</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>