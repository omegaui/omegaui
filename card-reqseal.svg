<svg fill="none" viewBox="0 0 196 155" width="196" height="155" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 149px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 12px;
					border: 1px solid #21262d;
					padding: 16px 14px 14px 18px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #F1E05A, #f5ec9a);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(241, 224, 90, 0.15); }
					100% { box-shadow: 0 0 14px rgba(241, 224, 90, 0.45); }
				}

				.icon-area {
					position: absolute;
					top: 12px;
					right: 14px;
					animation: shieldPulse 3s ease-in-out infinite alternate;
				}

				@keyframes shieldPulse {
					0% { transform: scale(1); }
					100% { transform: scale(1.06); }
				}

				.shield {
					width: 19px;
					height: 22px;
					background: rgba(241, 224, 90, 0.1);
					border: 1.5px solid rgba(241, 224, 90, 0.35);
					border-radius: 3px 3px 10px 10px;
					position: relative;
				}

				.shield-lock {
					width: 7px;
					height: 5px;
					border: 1.5px solid rgba(241, 224, 90, 0.55);
					border-radius: 2px;
					position: absolute;
					top: 10px;
					left: 4.5px;
				}

				.shield-hook {
					width: 5px;
					height: 4px;
					border: 1.5px solid rgba(241, 224, 90, 0.45);
					border-bottom: none;
					border-radius: 3px 3px 0 0;
					position: absolute;
					top: 6px;
					left: 5.5px;
				}

				.name {
					color: #e6edf3;
					font-size: 13px;
					font-weight: 600;
					margin-bottom: 6px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #7d8590;
					font-size: 10.5px;
					line-height: 1.4;
					max-width: 155px;
				}

				.meta {
					position: absolute;
					bottom: 14px;
					left: 18px;
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.lang-dot {
					width: 8px;
					height: 8px;
					background: #F1E05A;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 10px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="shield">
						<div class="shield-hook"></div>
						<div class="shield-lock"></div>
					</div>
				</div>
				<div class="name">reqseal</div>
				<div class="desc">Request freshness and replay-protection for HTTP APIs</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">JavaScript</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>