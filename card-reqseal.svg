<svg fill="none" viewBox="0 0 388 170" width="388" height="170" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 378px;
					height: 160px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 14px;
					border: 1px solid #21262d;
					padding: 22px 24px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 5px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 4px;
					background: linear-gradient(180deg, #F1E05A, #f5ec9a);
					border-radius: 14px 0 0 14px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 8px rgba(241, 224, 90, 0.2); }
					100% { box-shadow: 0 0 20px rgba(241, 224, 90, 0.5); }
				}

				.bg-orb {
					position: absolute;
					top: -30px;
					right: -30px;
					width: 120px;
					height: 120px;
					background: radial-gradient(circle, rgba(241, 224, 90, 0.05) 0%, transparent 70%);
					border-radius: 50%;
				}

				.icon-area {
					position: absolute;
					top: 16px;
					right: 22px;
					animation: shieldPulse 3s ease-in-out infinite alternate;
				}

				@keyframes shieldPulse {
					0% { transform: scale(1); }
					100% { transform: scale(1.05); }
				}

				.shield {
					width: 24px;
					height: 28px;
					background: rgba(241, 224, 90, 0.12);
					border: 1.5px solid rgba(241, 224, 90, 0.4);
					border-radius: 4px 4px 12px 12px;
					position: relative;
				}

				.shield-lock {
					width: 8px;
					height: 6px;
					border: 1.5px solid rgba(241, 224, 90, 0.6);
					border-radius: 2px;
					position: absolute;
					top: 12px;
					left: 6.5px;
				}

				.shield-hook {
					width: 6px;
					height: 5px;
					border: 1.5px solid rgba(241, 224, 90, 0.5);
					border-bottom: none;
					border-radius: 4px 4px 0 0;
					position: absolute;
					top: 7px;
					left: 7.5px;
				}

				.name {
					color: #e6edf3;
					font-size: 17px;
					font-weight: 600;
					margin-bottom: 8px;
					letter-spacing: -0.3px;
				}

				.desc {
					color: #7d8590;
					font-size: 12.5px;
					line-height: 1.45;
					max-width: 295px;
				}

				.meta {
					position: absolute;
					bottom: 20px;
					left: 24px;
					display: flex;
					align-items: center;
					gap: 8px;
				}

				.lang-dot {
					width: 10px;
					height: 10px;
					background: #F1E05A;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 11.5px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="bg-orb"></div>
				<div class="icon-area">
					<div class="shield">
						<div class="shield-hook"></div>
						<div class="shield-lock"></div>
					</div>
				</div>
				<div class="name">reqseal</div>
				<div class="desc">Lightweight request freshness and replay-protection layer for HTTP APIs</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">JavaScript</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>