<svg fill="none" viewBox="0 0 196 155" width="196" height="155" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 149px;
					background: linear-gradient(145deg, #0d1117 0%, #111827 100%);
					border-radius: 12px;
					border: 1px solid #21262d;
					padding: 16px 14px 14px 18px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #A97BFF, #c9a5ff);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(169, 123, 255, 0.15); }
					100% { box-shadow: 0 0 14px rgba(169, 123, 255, 0.45); }
				}

				.icon-area {
					position: absolute;
					top: 14px;
					right: 14px;
				}

				.gamepad-body {
					width: 28px;
					height: 17px;
					background: rgba(169, 123, 255, 0.12);
					border: 1.5px solid rgba(169, 123, 255, 0.35);
					border-radius: 6px;
					position: relative;
					animation: iconFloat 3s ease-in-out infinite alternate;
				}

				@keyframes iconFloat {
					0% { transform: translateY(0px); }
					100% { transform: translateY(-2px); }
				}

				.btn {
					width: 3px;
					height: 3px;
					background: #A97BFF;
					border-radius: 50%;
					position: absolute;
				}

				.btn-a { top: 4px; right: 4px; }
				.btn-b { top: 8px; right: 7px; }

				.dpad-h, .dpad-v {
					position: absolute;
					background: rgba(169, 123, 255, 0.5);
					border-radius: 1px;
				}

				.dpad-h {
					width: 8px;
					height: 2px;
					top: 7px;
					left: 4px;
				}

				.dpad-v {
					width: 2px;
					height: 8px;
					top: 4px;
					left: 7px;
				}

				.name {
					color: #e6edf3;
					font-size: 13px;
					font-weight: 600;
					margin-bottom: 6px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #7d8590;
					font-size: 10.5px;
					line-height: 1.4;
					max-width: 155px;
				}

				.meta {
					position: absolute;
					bottom: 14px;
					left: 18px;
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.lang-dot {
					width: 8px;
					height: 8px;
					background: #A97BFF;
					border-radius: 50%;
				}

				.lang-name {
					color: #7d8590;
					font-size: 10px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="gamepad-body">
						<div class="btn btn-a"></div>
						<div class="btn btn-b"></div>
						<div class="dpad-h"></div>
						<div class="dpad-v"></div>
					</div>
				</div>
				<div class="name">terraria_gamepad</div>
				<div class="desc">Use your phone as a wireless gamepad for Terraria</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Kotlin</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>