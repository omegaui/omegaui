<svg fill="none" viewBox="0 0 196 190" width="196" height="190" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 184px;
					background: linear-gradient(145deg, #ffffff 0%, #f6f8fa 100%);
					border-radius: 12px;
					border: 1px solid #d0d7de;
					padding: 20px 16px 16px 20px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #b08800, #d4a72c);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(176, 136, 0, 0.15); }
					100% { box-shadow: 0 0 14px rgba(176, 136, 0, 0.4); }
				}

				.icon-area {
					position: absolute;
					top: 16px;
					right: 16px;
					animation: shieldPulse 3s ease-in-out infinite alternate;
				}

				@keyframes shieldPulse {
					0% { transform: scale(1); }
					100% { transform: scale(1.06); }
				}

				.shield {
					width: 22px;
					height: 26px;
					background: rgba(176, 136, 0, 0.07);
					border: 1.5px solid rgba(176, 136, 0, 0.3);
					border-radius: 3px 3px 11px 11px;
					position: relative;
				}

				.shield-lock {
					width: 8px;
					height: 6px;
					border: 1.5px solid rgba(176, 136, 0, 0.5);
					border-radius: 2px;
					position: absolute;
					top: 12px;
					left: 5.5px;
				}

				.shield-hook {
					width: 6px;
					height: 5px;
					border: 1.5px solid rgba(176, 136, 0, 0.4);
					border-bottom: none;
					border-radius: 3px 3px 0 0;
					position: absolute;
					top: 7px;
					left: 6.5px;
				}

				.name {
					color: #1f2328;
					font-size: 14.5px;
					font-weight: 600;
					margin-bottom: 10px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #656d76;
					font-size: 12px;
					line-height: 1.5;
					max-width: 160px;
				}

				.meta {
					position: absolute;
					bottom: 16px;
					left: 20px;
					display: flex;
					align-items: center;
					gap: 6px;
				}

				.lang-dot {
					width: 9px;
					height: 9px;
					background: #b08800;
					border-radius: 50%;
				}

				.lang-name {
					color: #656d76;
					font-size: 11px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="shield">
						<div class="shield-hook"></div>
						<div class="shield-lock"></div>
					</div>
				</div>
				<div class="name">reqseal</div>
				<div class="desc">Request freshness and replay-protection for HTTP APIs</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">JavaScript</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>