<svg fill="none" viewBox="0 0 264 168" width="264" height="168" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.card {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, #ffffff 0%, #f6f8fb 100%);
  border: 1px solid #d1d9e0; border-radius: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1f2328;
}

.eye { width: 30px; height: 15px; border: 1.5px solid #00B4AB88; border-radius: 50%; position: relative;
  background: #00B4AB12; animation: eyeBlink 5s ease-in-out infinite; }
@keyframes eyeBlink { 0%, 44%, 48%, 100% { transform: scaleY(1); } 46% { transform: scaleY(0.1); } }
.pupil { width: 8px; height: 8px; background: #00B4AB; border-radius: 50%; position: absolute; top: 2px; left: 9.5px; }

.card { width: 256px; height: 160px; margin: 4px; padding: 18px 18px 16px 20px; }
.accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #00B4AB; }
.icon { position: absolute; top: 18px; right: 16px; }
.name { font-size: 15px; font-weight: 650; padding-right: 48px; letter-spacing: -0.2px; }
.desc { margin-top: 8px; font-size: 13px; line-height: 1.5; color: #59636e; }
.meta { position: absolute; left: 20px; bottom: 15px; display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: #59636e; }
.ldot { width: 9px; height: 9px; border-radius: 50%; background: #00B4AB; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
			</style>

<div class="card"><div class="accent"></div><div class="icon"><div class="eye"><div class="pupil"></div></div></div>
  <div class="name">nakime</div><div class="desc">Tracks PC sessions and flags unauthorized access attempts.</div>
  <div class="meta"><span class="ldot"></span>Dart</div>
</div>
		</div>
	</foreignObject>
</svg>
