<svg fill="none" viewBox="0 0 800 220" width="800" height="220" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 790px;
					height: 210px;
					background: linear-gradient(145deg, #0a0e17 0%, #0d1420 40%, #0f1729 100%);
					border-radius: 16px;
					border: 1px solid rgba(0, 220, 200, 0.15);
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 5px;
				}

				/* Animated border glow */
				.border-glow {
					position: absolute;
					top: -1px;
					left: -1px;
					right: -1px;
					bottom: -1px;
					border-radius: 16px;
					background: linear-gradient(90deg, transparent, rgba(0, 220, 200, 0.15), rgba(0, 180, 171, 0.3), rgba(0, 220, 200, 0.15), transparent);
					background-size: 200% 100%;
					animation: borderShimmer 4s linear infinite;
					z-index: 0;
					mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
					-webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
					-webkit-mask-composite: xor;
					mask-composite: exclude;
					padding: 1px;
				}

				@keyframes borderShimmer {
					0% { background-position: -200% 0; }
					100% { background-position: 200% 0; }
				}

				/* Grid background */
				.grid-bg {
					position: absolute;
					top: 0;
					left: 0;
					right: 0;
					bottom: 0;
					background-image:
						linear-gradient(rgba(0, 220, 200, 0.03) 1px, transparent 1px),
						linear-gradient(90deg, rgba(0, 220, 200, 0.03) 1px, transparent 1px);
					background-size: 40px 40px;
					z-index: 1;
				}

				/* Scanning line */
				.scan-line {
					position: absolute;
					top: 0;
					left: 0;
					right: 0;
					height: 2px;
					background: linear-gradient(90deg, transparent, rgba(0, 220, 200, 0.2), transparent);
					animation: scanDown 4s ease-in-out infinite;
					z-index: 2;
				}

				@keyframes scanDown {
					0% { top: 0; opacity: 0; }
					10% { opacity: 1; }
					90% { opacity: 1; }
					100% { top: 100%; opacity: 0; }
				}

				/* Content area */
				.content {
					position: relative;
					z-index: 3;
					display: flex;
					height: 100%;
					padding: 28px 32px;
				}

				/* Left section - branding */
				.left {
					flex: 1;
					display: flex;
					flex-direction: column;
					justify-content: center;
				}

				.badge {
					display: inline-flex;
					align-items: center;
					gap: 6px;
					background: rgba(0, 220, 200, 0.08);
					border: 1px solid rgba(0, 220, 200, 0.2);
					border-radius: 20px;
					padding: 4px 12px;
					margin-bottom: 14px;
					width: fit-content;
				}

				.badge-dot {
					width: 6px;
					height: 6px;
					background: #00DCC8;
					border-radius: 50%;
					animation: badgePulse 2s ease-in-out infinite;
				}

				@keyframes badgePulse {
					0%, 100% { opacity: 0.5; box-shadow: 0 0 4px rgba(0, 220, 200, 0.3); }
					50% { opacity: 1; box-shadow: 0 0 8px rgba(0, 220, 200, 0.6); }
				}

				.badge-text {
					color: #00DCC8;
					font-size: 10px;
					font-weight: 500;
					letter-spacing: 1.5px;
					text-transform: uppercase;
				}

				.title-row {
					display: flex;
					align-items: baseline;
					gap: 10px;
					margin-bottom: 8px;
				}

				.title {
					color: #e6edf3;
					font-size: 28px;
					font-weight: 700;
					letter-spacing: -0.5px;
				}

				.title-accent {
					color: #00DCC8;
				}

				.version {
					color: #484f58;
					font-size: 12px;
					font-family: "SF Mono", "Fira Code", Consolas, monospace;
				}

				.subtitle {
					color: #7d8590;
					font-size: 13px;
					line-height: 1.5;
					max-width: 380px;
				}

				.meta-row {
					display: flex;
					align-items: center;
					gap: 16px;
					margin-top: 14px;
				}

				.meta-item {
					display: flex;
					align-items: center;
					gap: 5px;
				}

				.lang-dot {
					width: 10px;
					height: 10px;
					background: #00B4AB;
					border-radius: 50%;
				}

				.meta-text {
					color: #7d8590;
					font-size: 11px;
				}

				.star-icon {
					color: #7d8590;
					font-size: 12px;
				}

				/* Right section - terminal */
				.right {
					display: flex;
					align-items: center;
					justify-content: center;
					padding-left: 30px;
				}

				.terminal {
					width: 310px;
					height: 145px;
					background: rgba(0, 0, 0, 0.4);
					border: 1px solid rgba(0, 220, 200, 0.12);
					border-radius: 10px;
					overflow: hidden;
				}

				.terminal-header {
					display: flex;
					align-items: center;
					gap: 6px;
					padding: 8px 12px;
					background: rgba(0, 220, 200, 0.04);
					border-bottom: 1px solid rgba(0, 220, 200, 0.08);
				}

				.term-dot {
					width: 7px;
					height: 7px;
					border-radius: 50%;
				}

				.term-dot-r { background: #ff5f57; opacity: 0.6; }
				.term-dot-y { background: #febc2e; opacity: 0.6; }
				.term-dot-g { background: #28c840; opacity: 0.6; }

				.term-title {
					color: #484f58;
					font-size: 10px;
					font-family: "SF Mono", "Fira Code", Consolas, monospace;
					margin-left: 6px;
				}

				.terminal-body {
					padding: 12px 14px;
					font-family: "SF Mono", "Fira Code", Consolas, monospace;
					font-size: 11.5px;
					line-height: 1.7;
				}

				.line {
					display: flex;
					gap: 0;
					white-space: nowrap;
				}

				.prompt {
					color: #00DCC8;
				}

				.cmd {
					color: #e6edf3;
				}

				.flag {
					color: #A97BFF;
				}

				.arg {
					color: #F1E05A;
				}

				.output {
					color: #484f58;
				}

				.success {
					color: #3fb950;
				}

				/* Typing cursor */
				.cursor {
					display: inline-block;
					width: 7px;
					height: 14px;
					background: #00DCC8;
					margin-left: 2px;
					animation: blink 1s step-end infinite;
					vertical-align: middle;
				}

				@keyframes blink {
					0%, 100% { opacity: 1; }
					50% { opacity: 0; }
				}

				/* Progress bar */
				.progress-bar {
					width: 160px;
					height: 6px;
					background: rgba(255, 255, 255, 0.05);
					border-radius: 3px;
					overflow: hidden;
					margin-top: 2px;
					display: inline-block;
				}

				.progress-fill {
					height: 100%;
					width: 100%;
					background: linear-gradient(90deg, #00DCC8, #00B4AB);
					border-radius: 3px;
					animation: fillUp 3s ease-in-out infinite;
				}

				@keyframes fillUp {
					0% { width: 0%; }
					70% { width: 100%; }
					100% { width: 100%; }
				}

				/* Floating particles */
				.particle {
					position: absolute;
					width: 2px;
					height: 2px;
					background: #00DCC8;
					border-radius: 50%;
					z-index: 2;
					animation: float 6s ease-in-out infinite;
				}

				.p1 { top: 30px; right: 60px; animation-delay: 0s; }
				.p2 { top: 80px; right: 120px; animation-delay: 1s; }
				.p3 { bottom: 40px; right: 80px; animation-delay: 2s; }
				.p4 { top: 50px; right: 200px; animation-delay: 3s; }
				.p5 { bottom: 60px; right: 160px; animation-delay: 0.5s; }

				@keyframes float {
					0%, 100% { opacity: 0; transform: translateY(0) scale(1); }
					25% { opacity: 0.6; }
					50% { opacity: 1; transform: translateY(-15px) scale(1.5); }
					75% { opacity: 0.4; }
				}

				/* Corner accents */
				.corner {
					position: absolute;
					width: 20px;
					height: 20px;
					z-index: 2;
				}

				.corner-tl {
					top: 6px;
					left: 6px;
					border-top: 1.5px solid rgba(0, 220, 200, 0.2);
					border-left: 1.5px solid rgba(0, 220, 200, 0.2);
					border-radius: 4px 0 0 0;
				}

				.corner-tr {
					top: 6px;
					right: 6px;
					border-top: 1.5px solid rgba(0, 220, 200, 0.2);
					border-right: 1.5px solid rgba(0, 220, 200, 0.2);
					border-radius: 0 4px 0 0;
				}

				.corner-bl {
					bottom: 6px;
					left: 6px;
					border-bottom: 1.5px solid rgba(0, 220, 200, 0.2);
					border-left: 1.5px solid rgba(0, 220, 200, 0.2);
					border-radius: 0 0 0 4px;
				}

				.corner-br {
					bottom: 6px;
					right: 6px;
					border-bottom: 1.5px solid rgba(0, 220, 200, 0.2);
					border-right: 1.5px solid rgba(0, 220, 200, 0.2);
					border-radius: 0 0 4px 0;
				}
			</style>
			<div class="card">
				<div class="border-glow"></div>
				<div class="grid-bg"></div>
				<div class="scan-line"></div>
				<div class="corner corner-tl"></div>
				<div class="corner corner-tr"></div>
				<div class="corner corner-bl"></div>
				<div class="corner corner-br"></div>
				<div class="particle p1"></div>
				<div class="particle p2"></div>
				<div class="particle p3"></div>
				<div class="particle p4"></div>
				<div class="particle p5"></div>
				<div class="content">
					<div class="left">
						<div class="badge">
							<div class="badge-dot"></div>
							<span class="badge-text">Package Manager</span>
						</div>
						<div class="title-row">
							<span class="title"><span class="title-accent">g</span>pm</span>
							<span class="version">v3.0</span>
						</div>
						<div class="subtitle">Install apps directly from GitHub repos with out-of-the-box update support. Package management meets cross-platform build tools.</div>
						<div class="meta-row">
							<div class="meta-item">
								<div class="lang-dot"></div>
								<span class="meta-text">Dart</span>
							</div>
							<div class="meta-item">
								<span class="star-icon">&#9733;</span>
								<span class="meta-text">53</span>
							</div>
						</div>
					</div>
					<div class="right">
						<div class="terminal">
							<div class="terminal-header">
								<div class="term-dot term-dot-r"></div>
								<div class="term-dot term-dot-y"></div>
								<div class="term-dot term-dot-g"></div>
								<span class="term-title">~/.terminal</span>
							</div>
							<div class="terminal-body">
								<div class="line"><span class="prompt">&#x276F;&#160;</span><span class="cmd">gpm&#160;</span><span class="flag">install&#160;</span><span class="arg">user/repo</span></div>
								<div class="line"><span class="output">Resolving dependencies...</span></div>
								<div class="line"><span class="output">Building from source</span></div>
								<div class="line">
									<span class="output">  </span>
									<div class="progress-bar"><div class="progress-fill"></div></div>
								</div>
								<div class="line"><span class="success">&#x2714; Installed successfully</span><span class="cursor"></span></div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>