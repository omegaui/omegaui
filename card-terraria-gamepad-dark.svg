<svg fill="none" viewBox="0 0 264 168" width="264" height="168" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.card {
  position: relative; overflow: hidden;
  background: linear-gradient(150deg, #0f1522 0%, #121b2c 100%);
  border: 1px solid #232c3a; border-radius: 14px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #e6edf3;
}

.pad { width: 34px; height: 20px; border-radius: 10px; border: 1.5px solid #A97BFF88; background: #A97BFF12; position: relative; }
.pad::before { content: ""; position: absolute; left: 6px; top: 7.5px; width: 8px; height: 2px; background: #A97BFF;
  box-shadow: 0 0 0 0 #A97BFF; }
.pad::after { content: ""; position: absolute; left: 9px; top: 4.5px; width: 2px; height: 8px; background: #A97BFF; }
.btn { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #A97BFF; }
.b1 { right: 6px; top: 5px; animation: press 2s ease-in-out infinite; } .b2 { right: 10px; top: 10px; }
@keyframes press { 50% { opacity: .3; } }

.card { width: 256px; height: 160px; margin: 4px; padding: 18px 18px 16px 20px; }
.accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #A97BFF; }
.icon { position: absolute; top: 18px; right: 16px; }
.name { font-size: 15px; font-weight: 650; padding-right: 48px; letter-spacing: -0.2px; }
.desc { margin-top: 8px; font-size: 13px; line-height: 1.5; color: #9198a1; }
.meta { position: absolute; left: 20px; bottom: 15px; display: flex; align-items: center; gap: 6px;
  font-size: 11.5px; color: #9198a1; }
.ldot { width: 9px; height: 9px; border-radius: 50%; background: #A97BFF; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
			</style>

<div class="card"><div class="accent"></div><div class="icon"><div class="pad"><span class="btn b1"></span><span class="btn b2"></span></div></div>
  <div class="name">terraria_gamepad</div><div class="desc">Turns your phone into a wireless gamepad for Terraria.</div>
  <div class="meta"><span class="ldot"></span>Kotlin</div>
</div>
		</div>
	</foreignObject>
</svg>
