			<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

.wrap { width: 800px; padding: 6px 5px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif; }
.row { display: flex; align-items: center; gap: 6px; height: 38px; }
.lbl { width: 78px; flex: none; font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; font-size: 11px; color: #8c959f;
