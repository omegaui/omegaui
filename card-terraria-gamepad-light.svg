<svg fill="none" viewBox="0 0 196 190" width="196" height="190" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				* { margin: 0; padding: 0; box-sizing: border-box; }

				.card {
					width: 190px;
					height: 184px;
					background: linear-gradient(145deg, #ffffff 0%, #f6f8fa 100%);
					border-radius: 12px;
					border: 1px solid #d0d7de;
					padding: 20px 16px 16px 20px;
					position: relative;
					overflow: hidden;
					font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
					margin: 3px;
				}

				.accent {
					position: absolute;
					left: 0;
					top: 0;
					bottom: 0;
					width: 3px;
					background: linear-gradient(180deg, #8957e5, #b088f9);
					border-radius: 12px 0 0 12px;
					animation: glow 2.5s ease-in-out infinite alternate;
				}

				@keyframes glow {
					0% { box-shadow: 0 0 6px rgba(137, 87, 229, 0.15); }
					100% { box-shadow: 0 0 14px rgba(137, 87, 229, 0.4); }
				}

				.icon-area {
					position: absolute;
					top: 18px;
					right: 16px;
				}

				.gamepad-body {
					width: 34px;
					height: 21px;
					background: rgba(137, 87, 229, 0.08);
					border: 1.5px solid rgba(137, 87, 229, 0.3);
					border-radius: 7px;
					position: relative;
					animation: iconFloat 3s ease-in-out infinite alternate;
				}

				@keyframes iconFloat {
					0% { transform: translateY(0px); }
					100% { transform: translateY(-2px); }
				}

				.btn {
					width: 3.5px;
					height: 3.5px;
					background: #8957e5;
					border-radius: 50%;
					position: absolute;
				}

				.btn-a { top: 4px; right: 5px; }
				.btn-b { top: 10px; right: 8px; }

				.dpad-h, .dpad-v {
					position: absolute;
					background: rgba(137, 87, 229, 0.45);
					border-radius: 1px;
				}

				.dpad-h {
					width: 9px;
					height: 2.5px;
					top: 8px;
					left: 5px;
				}

				.dpad-v {
					width: 2.5px;
					height: 9px;
					top: 5px;
					left: 8px;
				}

				.name {
					color: #1f2328;
					font-size: 14.5px;
					font-weight: 600;
					margin-bottom: 10px;
					letter-spacing: -0.2px;
				}

				.desc {
					color: #656d76;
					font-size: 12px;
					line-height: 1.5;
					max-width: 160px;
				}

				.meta {
					position: absolute;
					bottom: 16px;
					left: 20px;
					display: flex;
					align-items: center;
					gap: 6px;
				}

				.lang-dot {
					width: 9px;
					height: 9px;
					background: #8957e5;
					border-radius: 50%;
				}

				.lang-name {
					color: #656d76;
					font-size: 11px;
				}
			</style>
			<div class="card">
				<div class="accent"></div>
				<div class="icon-area">
					<div class="gamepad-body">
						<div class="btn btn-a"></div>
						<div class="btn btn-b"></div>
						<div class="dpad-h"></div>
						<div class="dpad-v"></div>
					</div>
				</div>
				<div class="name">terraria_gamepad</div>
				<div class="desc">Use your phone as a wireless gamepad for Terraria</div>
				<div class="meta">
					<div class="lang-dot"></div>
					<span class="lang-name">Kotlin</span>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>